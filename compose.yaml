services:
  data_tailor: 
    network_mode: host
    platform: linux/amd64
    build: 
      dockerfile: data-tailor.Dockerfile
    volumes: 
      - ./.eumdac:/root/.eumdac
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40000/api/v1/user_info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  download_service:
    network_mode: host
    platform: linux/amd64
    environment:
      - DATA_RETRIEVAL_MAX_JOBS=${DATA_RETRIEVAL_MAX_JOBS}
      - DATA_RETRIEVAL_START_DATE=${DATA_RETRIEVAL_START_DATE}
      - DATA_RETRIEVAL_TIME_SPAN=${DATA_RETRIEVAL_TIME_SPAN}
    build:
      dockerfile: data-retrieval.Dockerfile
    volumes:
      - ${DATA_MOUNT_POINT}:/mnt/sat/seviri/europe_hrit
      - ./scripts:/scripts
      - ./.eumdac:/root/.eumdac
    depends_on:
      data_tailor:
        condition: service_healthy
  courier_service:
    platform: linux/amd64
    build:
      dockerfile: courier.Dockerfile
    volumes:
      - ${DATA_MOUNT_POINT}:/incoming
    ports:
      - "8000:8000"
  prometheus:
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - courier_service
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
  grafana:
    image: grafana/grafana
    platform: linux/amd64
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - courier_service
